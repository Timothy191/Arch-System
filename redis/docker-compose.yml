# Arch-Systems — isolated Redis offload stack
# Start: pnpm redis:dev  |  Stop: pnpm redis:stop
# Portal link: REDIS_URL=redis://127.0.0.1:6380 in apps/portal/.env
#
# Host port 6380 avoids colliding with a system Redis on :6379.

services:
  redis:
    image: redis:7-alpine
    container_name: arch-redis-offload
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    command:
      - redis-server
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - "60"
      - "1"
      - --appendonly
      - "yes"
    volumes:
      - redis_offload_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  redis_offload_data:
