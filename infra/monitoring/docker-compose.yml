version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: plantcor-monitor-prometheus
    restart: unless-stopped
    ports:
      - '9093:9090'
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - plantcor-monitoring
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  grafana:
    image: grafana/grafana:11.0.0
    container_name: plantcor-grafana
    restart: unless-stopped
    ports:
      - '9091:3000' # Exposed on port 9091 to avoid colliding with Next.js (3000) or Flowise (3001)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin} # Default admin password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - plantcor-monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: plantcor-cadvisor
    restart: unless-stopped
    ports:
      - '8082:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - plantcor-monitoring

  otel-collector:
    image: otel/opentelemetry-collector:0.118.0
    container_name: plantcor-otel-collector
    restart: unless-stopped
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
      - '8889:8889' # Prometheus metrics endpoint
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: ['--config=/etc/otel-collector-config.yaml']
    networks:
      - plantcor-monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: plantcor-alertmanager
    restart: unless-stopped
    ports:
      - '9094:9093'
    volumes:
      - ../../infra/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - plantcor-monitoring

  loki:
    image: grafana/loki:2.9.0
    container_name: plantcor-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    networks:
      - plantcor-monitoring

  tempo:
    image: grafana/tempo:2.4.0
    container_name: plantcor-tempo
    restart: unless-stopped
    ports:
      - '3200:3200'
    networks:
      - plantcor-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  plantcor-monitoring:
    driver: bridge
