# Arch-System canonical observability stack (local + optional CI runner).
#
# This is the single Compose definition for OpenTelemetry, Prometheus, Grafana,
# Alertmanager, cAdvisor, Loki, Tempo, and the optional Woodpecker CI pair.
# `infra/docker/compose.observability.yml` was removed to prevent two competing
# Grafana/Prometheus stacks from fighting over container names and ports.
#
# Usage:
#   pnpm monitor:grafana                          # core stack
#   pnpm monitor:grafana-stop                     # stop core stack
#   docker compose -f infra/monitoring/docker-compose.yml --profile ci up -d
#
# Host ports mirror the env templates (`PROMETHEUS_URL=http://127.0.0.1:9090`,
# `GRAFANA_URL=http://127.0.0.1:3005`).
name: plantcor-observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.118.0
    container_name: plantcor-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
      - '127.0.0.1:8889:8889' # Prometheus exporter
      - '127.0.0.1:13133:13133' # health_check extension
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: plantcor-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../infra/observability/prometheus-rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - otel-collector
      - alertmanager
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:11.0.0
    container_name: plantcor-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3005:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DEFAULT_THEME=light
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: plantcor-alertmanager
    restart: unless-stopped
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      # Alertmanager has no env-var expansion. To enable Slack/PagerDuty, copy
      # the tracked config to alertmanager.local.yml with real credentials and
      # point this mount at it (see infra/monitoring/.env.example).
      - ${ALERTMANAGER_CONFIG_PATH:-../observability/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - plantcor-observability
    mem_limit: 128m
    cpus: 0.25

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: plantcor-cadvisor
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - plantcor-observability
    mem_limit: 256m
    cpus: 0.25

  loki:
    image: grafana/loki:2.9.0
    container_name: plantcor-loki
    restart: unless-stopped
    ports:
      - '127.0.0.1:3100:3100'
    volumes:
      - loki_data:/loki
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  tempo:
    image: grafana/tempo:2.4.0
    container_name: plantcor-tempo
    restart: unless-stopped
    ports:
      - '127.0.0.1:3200:3200'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    command: ['-config.file=/etc/tempo.yaml']
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v2
    container_name: plantcor-woodpecker-server
    restart: unless-stopped
    profiles: ['ci']
    ports:
      - '127.0.0.1:8000:8000'
      - '127.0.0.1:9001:9000'
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=${WOODPECKER_HOST:-http://localhost:8000}
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT:-}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET:-}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-arch-system-woodpecker-secret}
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v2
    container_name: plantcor-woodpecker-agent
    restart: unless-stopped
    profiles: ['ci']
    depends_on:
      - woodpecker-server
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-arch-system-woodpecker-secret}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - plantcor-observability
    mem_limit: 2048m
    cpus: 2.0

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  woodpecker_data:

networks:
  plantcor-observability:
    driver: bridge
