# Arch-System Production Redis Configuration
# Derived from official redis/redis repository (https://github.com/redis/redis)
# File: redis.conf (unstable branch)
#
# This configuration is optimized for the Arch-System telemetry, cache,
# rate limiting, and session storage workloads.
#
# Usage:
#   redis-server /path/to/infra/redis/redis.conf

################################## NETWORK #####################################
# Bind to localhost only — this instance is accessed via Docker bridge
# network from the portal application container. Never expose to 0.0.0.0
# without TLS and a requirepass password.
bind 127.0.0.1 -::1

# Protected mode: enforce local-only connections when no password is set.
protected-mode yes

# Listen on the standard Redis port.
port 6379

# TCP listen backlog — high value for burst traffic from FUXA polling.
tcp-backlog 511

# Close connections after 30 seconds of inactivity (0 = disabled).
timeout 300

# Send TCP keep-alive packets every 300 seconds to detect dead peers.
tcp-keepalive 300

################################# GENERAL #####################################
# Run as a foreground process (Docker-managed).
daemonize no

# Log level: notice is the production standard.
loglevel notice

# Log to stdout (captured by Docker logging driver).
logfile ""

# Number of logical databases (0-15).
databases 16

# Hide PII from log output.
hide-user-data-from-log yes

# Disable process title modification inside containers.
set-proc-title no

################################# MEMORY ######################################
# Limit memory to 256 MB. Once reached, evict keys per policy below.
maxmemory 256mb

# Evict least-recently-used keys with a TTL set first, then any keys.
# allkeys-lru ensures cache-like data (telemetry:last, arch:*) is evicted
# before critical data, but since this is a dedicated instance we use
# allkeys-lru to guarantee bounded memory under high ingest.
maxmemory-policy allkeys-lru

# Warn if memory fragmentation exceeds 90%.
maxmemory-fragmentation-threshold 90

# Reject writes when out-of-memory to protect the event loop.
maxmemory-clients 0

################################ SNAPSHOTTING ################################
# Persist to disk using RDB snapshots:
#   - Every 60 seconds if at least 1 key changed
#   - Every 300 seconds if at least 100 keys changed
#   - Every 3600 seconds if at least 1 key changed
save 60 1
save 300 100
save 3600 1

# Stop accepting writes if the last background save failed.
stop-writes-on-bgsave-error yes

# Compress string objects in RDB files (saves CPU/disk).
rdbcompression yes

# Include CRC64 checksum in RDB files for corruption detection.
rdbchecksum yes

# RDB filename.
dbfilename dump.rdb

# Working directory (mounted volume).
dir /data

################################# APPEND ONLY FILE ############################
# AOF disabled — RDB snapshots are sufficient for our cache/telemetry
# workload. AOF adds write amplification and I/O overhead we don't need.
appendonly no

# Rewrite AOF when it grows beyond 100% of baseline size.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

################################# SLOW LOG ###################################
# Log commands taking longer than 10ms.
slowlog-log-slower-than 10000

# Keep the last 128 slow commands.
slowlog-max-len 128

################################# LATENCY ####################################
# Track latency events for monitoring.
latency-monitor-threshold 100

################################# NOTIFICATION ###############################
# Notify keyspace events for cache invalidation broadcast.
notify-keyspace-events "Ex"

################################# SECURITY ###################################
# No default password — rely on bind 127.0.0.1 and Docker network isolation.
# For production deployments, set requirepass and configure the client
# (packages/redis/src/client.ts) to use it via REDIS_PASSWORD.
requirepass ""

# Disable dangerous commands in production.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""