groups:
  - name: application_alerts
    rules:
      - alert: HighErrorRate
        expr: job:request_error_rate{job="portal"} > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High HTTP Error Rate on Portal
          description: "{{ $value | humanizePercentage }} of requests are failing."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High P95 Latency
          description: "P95 latency is over 1 second (current: {{ $value }}s)."

      - alert: DatabaseConnectionIssues
        expr: up{job="database"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Database Down
          description: "Prometheus cannot scrape database metrics."
