groups:
  # Cache metrics exposed by /api/metrics (portal_cache_*). The previous
  # amca_* metric names were never emitted, so every rule here was inert.
  - name: cache_alerts
    rules:
      - alert: CacheMissRateTooHigh
        expr: >-
          sum(rate(portal_cache_misses_total[5m]))
          /
          (sum(rate(portal_cache_hits_total[5m])) + sum(rate(portal_cache_misses_total[5m]))) > 0.4
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: 'Cache Miss Rate exceeds 40%'
          description: 'Cache miss rate is {{ $value | humanizePercentage }}. Policy engine may not be keeping up.'

      - alert: L2CacheLatencyHigh
        expr: portal_cache_latency_ms{metric="p95"} > 100
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: L2 Cache P95 Latency Above 100ms
          description: 'L2 Redis cache p95 latency has exceeded 100ms. Consider cache optimization or Redis scaling.'

      - alert: CacheErrorsElevated
        expr: rate(portal_cache_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: 'Redis cache errors elevated'
          description: 'Cache errors are occurring at {{ $value }}/s. Check Redis connectivity and the /api/health probe.'
