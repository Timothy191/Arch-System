global:
  resolve_timeout: 5m

# Default route intentionally discards alerts so the stack starts cleanly with
# no external credentials. To enable delivery, copy this file to
# infra/observability/alertmanager.local.yml (gitignored), uncomment the
# matching receiver, insert real credentials, and set ALERTMANAGER_CONFIG_PATH
# to that file before starting the stack. Alertmanager does not expand
# environment variables, so credentials must be literal values in that local
# copy.
route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'null'
  routes:
    - match:
        severity: critical
      receiver: 'null'
      # receiver: 'pagerduty-critical'
      continue: true
    - match:
        severity: warning
      receiver: 'null'
      # receiver: 'slack-notifications'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname', 'job']

receivers:
  - name: 'null'

