services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: arch-qdrant
    restart: unless-stopped
    ports:
      - '127.0.0.1:6333:6333'
      - '127.0.0.1:6334:6334'
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 512m
    cpus: 1

volumes:
  qdrant_data:
