version: '3.8'

services:
  redis:
    image: redis:7
    container_name: arch-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'notice']
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - arch-redis-net

  redis-ui:
    image: redis/redisinsight:latest
    container_name: arch-redis-ui
    restart: unless-stopped
    ports:
      - '127.0.0.1:5540:5540'
    volumes:
      - redis_insight_data:/data
    environment:
      - RITRUSTEDORIGINS=http://localhost:5540,http://127.0.0.1:5540
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - arch-redis-net

volumes:
  redis_data:
  redis_insight_data:

networks:
  arch-redis-net:
    driver: bridge
