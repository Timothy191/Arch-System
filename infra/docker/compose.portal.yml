version: '3.8'

# NOTE: Production builds in `apps/portal/docker/Dockerfile` already mount BuildKit
# cache (`--mount=type=cache,id=nextjs,target=/app/apps/portal/.next/cache`).
# If running `next dev --turbopack` inside a dev container override, mount named
# volumes for `/app/apps/portal/.next/cache` and `/app/apps/portal/.next/dev/cache`
# so Turbopack's persistent filesystem cache survives container restarts without
# paying bind-mount I/O overhead.

services:
  portal:
    build:
      context: ../../
      dockerfile: apps/portal/docker/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - ../../apps/portal/.env
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../certs:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - portal

volumes:
  nginx-cache:
