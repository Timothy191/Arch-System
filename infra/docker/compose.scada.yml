# Base SCADA stack — always brought up by `pnpm dev` (non-quick, non-hosted).
# AGENT-TRACE: Split out of compose.tools.yml (2026-08-28) so the lightweight
# FUXA dev-sim is always available without opting into the heavy tools stack
# (`pnpm dev -- -t`). Volume name `docker_fuxa_data` is preserved because the
# compose project name derives from this directory (`docker`) — zero migration.
# Reverse-flow ingest (D2-a): the portal exposes /api/scada/tags which FUXA
# pulls via host.docker.internal → host portal dev server.
services:
  fuxa:
    image: frangoteam/fuxa:latest
    container_name: plantcor-fuxa
    restart: unless-stopped
    # AGENT-TRACE: FUXA's node process ignores SIGTERM, so `docker stop` escalates
    # to SIGKILL (exit 137). SIGINT traps cleanly in node; 30s grace covers shutdown.
    stop_signal: SIGINT
    stop_grace_period: 30s
    ports:
      - "1881:1881"
    volumes:
      - fuxa_data:/root/.fuxa
    environment:
      - NODE_ENV=production
    # Lets the FUXA container reach the portal dev server on the host so its
    # WebAPI device can pull /api/scada/tags (D2-a). host-gateway is the Linux
    # equivalent of Docker Desktop's host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-c", ":> /dev/tcp/127.0.0.1/1881"]
      interval: 15s
      timeout: 10s
      retries: 3
    networks:
      - plantcor-tools

volumes:
  fuxa_data:

networks:
  plantcor-tools:
    driver: bridge
