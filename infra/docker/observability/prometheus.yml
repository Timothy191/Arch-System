global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'arch-portal-metrics'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'arch-portal-vercel'
    scheme: https
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['arch-system.vercel.app']
