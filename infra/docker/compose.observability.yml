# Arch-System — Observability (OTel Collector + Prometheus + Grafana) & Woodpecker CI
# Usage:
#   docker compose -f infra/docker/compose.observability.yml up -d
#   docker compose -f infra/docker/compose.observability.yml --profile ci up -d

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: plantcor-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    ports:
      - '127.0.0.1:4317:4317'
      - '127.0.0.1:4318:4318'
      - '127.0.0.1:8889:8889'
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  prometheus:
    image: prom/prometheus:latest
    container_name: plantcor-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - otel-collector
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:latest
    container_name: plantcor-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3005:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DEFAULT_THEME=light
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/arch-portal-dashboard.json:/etc/grafana/provisioning/dashboards/arch-portal-dashboard.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v2
    container_name: plantcor-woodpecker-server
    restart: unless-stopped
    profiles: ['ci']
    ports:
      - '127.0.0.1:8000:8000'
      - '127.0.0.1:9001:9000'
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=${WOODPECKER_HOST:-http://localhost:8000}
      - WOODPECKER_GITHUB=true
      - WOODPECKER_GITHUB_CLIENT=${WOODPECKER_GITHUB_CLIENT:-}
      - WOODPECKER_GITHUB_SECRET=${WOODPECKER_GITHUB_SECRET:-}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-arch-system-woodpecker-secret}
    volumes:
      - woodpecker_data:/var/lib/woodpecker
    networks:
      - plantcor-observability
    mem_limit: 512m
    cpus: 0.5

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v2
    container_name: plantcor-woodpecker-agent
    restart: unless-stopped
    profiles: ['ci']
    depends_on:
      - woodpecker-server
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-arch-system-woodpecker-secret}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - plantcor-observability
    mem_limit: 2048m
    cpus: 2.0

volumes:
  prometheus_data:
  grafana_data:
  woodpecker_data:

networks:
  plantcor-observability:
    driver: bridge
