version: '3.8'

# Production overrides for services declared in compose.tools.yml.
# Usage: docker compose -f infra/docker/compose.tools.yml -f infra/docker/compose.production.yml up -d
#
# Adds: restart policies, resource limits, health checks, and production-safe env overrides.

services:
  redis:
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        'redis-server',
        '--save',
        '60',
        '1',
        '--loglevel',
        'warning',
        '--requirepass',
        '${REDIS_PASSWORD:?Set REDIS_PASSWORD}',
      ]
    volumes:
      - /opt/arch-systems/data/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'
      # Redis is the only overridden service in the base tools stack.
