services:
  kestra:
    image: kestra/kestra:latest
    network_mode: 'host'
    restart: unless-stopped
    volumes:
      - /home/tim/kestra/flows:/kestra/flows
      - /home/tim/.local/bin:/home/tim/.local/bin
    environment:
      JAVA_OPTS: '-Xmx2048m'
      KESTRA_TRACER_EXPORTER: 'otlp'
      KESTRA_TRACER_OTLP_ENDPOINT: 'http://127.0.0.1:4317'
      # Port 8080/8081 belong to mine-management (Access_Control_System);
      # scanner devices are hard-wired to :8080, so Kestra runs on 8090/8091.
      KESTRA_CONFIGURATION: |
        micronaut:
          server:
            port: 8090
        endpoints:
          all:
            port: 8091
        kestra:
          server:
            basic-auth:
              username: "${KESTRA_BASIC_AUTH_USERNAME}"
              password: "${KESTRA_BASIC_AUTH_PASSWORD}"
          repository:
            type: postgres
          queue:
            type: postgres
          jdbc:
            postgres:
              url: jdbc:postgresql://127.0.0.1:54322/kestra
              username: ${KESTRA_DB_USERNAME:-supabase_admin}
              password: ${KESTRA_DB_PASSWORD:-postgres}
    command: server local
    mem_limit: 2048m
    cpus: 2.0

  jaeger:
    image: jaegertracing/all-in-one:latest
    network_mode: 'host'
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    mem_limit: 512m
    cpus: 1.0
