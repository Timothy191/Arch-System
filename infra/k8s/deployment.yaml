apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: arch-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/plantcor/arch-system-portal:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-secrets
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-agent
  namespace: arch-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-agent
  template:
    metadata:
      labels:
        app: cache-agent
    spec:
      containers:
        - name: cache-agent
          image: ghcr.io/plantcor/arch-system-cache-agent:latest
          envFrom:
            - configMapRef:
                name: portal-config
            - secretRef:
                name: portal-secrets
          resources:
            requests:
              cpu: '100m'
              memory: '256Mi'
