apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: portal
  namespace: arch-system
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    canary:
      canaryMetadata:
        labels:
          role: canary
      steps:
        - setWeight: 25
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 50
        - pause: { duration: 2m }
        - analysis:
            templates:
              - templateName: success-rate
        - setWeight: 100
  selector:
    matchLabels:
      app: portal
  template:
    metadata:
      labels:
        app: portal
    spec:
      containers:
        - name: portal
          image: ghcr.io/plantcor/arch-system-portal@sha256:REPLACE_WITH_DIGEST
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: '250m'
              memory: '512Mi'
            limits:
              cpu: '1000m'
              memory: '1Gi'
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
