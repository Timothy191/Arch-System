apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portal-allow
  namespace: arch-system
spec:
  podSelector:
    matchLabels:
      app: portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
