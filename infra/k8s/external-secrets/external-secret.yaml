apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: portal-secrets
  namespace: arch-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: portal-secrets
  data:
    - secretKey: SUPABASE_URL
      remoteRef:
        key: arch-system/portal
        property: supabase_url
    - secretKey: SUPABASE_SERVICE_KEY
      remoteRef:
        key: arch-system/portal
        property: supabase_service_key
