# Cloudflare Tunnel Configuration for FUXA SCADA Integration
# Target: NEXT_PUBLIC_FUXA_URL (https://fuxa.production-mining.com)

tunnel: 7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c
credentials-file: /etc/cloudflared/creds/7f8a9b0c-1d2e-3f4a-5b6c-7d8e9f0a1b2c.json

ingress:
  # Route 1: FUXA Web SCADA UI & WebSocket Telemetry Stream
  - hostname: fuxa.production-mining.com
    service: http://10.0.4.12:8088
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      keepAliveTimeout: 90s
      http2Origin: true
      webSocket: true

  # Route 2: SCADA Telematics REST & OPC-UA Proxy Endpoint
  - hostname: fuxa-api.production-mining.com
    service: http://10.0.4.12:8088/api
    originRequest:
      connectTimeout: 15s
      keepAliveConnections: 100

  # Catch-all fallback rule (required by cloudflared)
  - service: http_status:404
