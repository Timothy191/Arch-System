global:
  scrape_interval: 5s # High-fidelity scraping for active dev feedback
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor' # Scrapes real-time container resource usages (CPU, Memory, IO)
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'otel-collector' # Scrapes OTLP metrics exported by the OpenTelemetry Collector
    static_configs:
      - targets: ['otel-collector:8889']

  # - job_name: "plantcor-portal"
  #   metrics_path: "/api/metrics"
  #   static_configs:
