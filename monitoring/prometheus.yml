global:
  scrape_interval: 5s # High-fidelity scraping for active dev feedback
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cadvisor' # Scrapes real-time container resource usages (CPU, Memory, IO)
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'otel-collector' # Scrapes OTLP metrics exported by the OpenTelemetry Collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'plantcor-portal'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'plantcor-portal-control-room'
    metrics_path: '/api/metrics/prometheus'
    static_configs:
      - targets: ['host.docker.internal:3000']

  - job_name: 'supabase-cloud-metrics'
    scheme: 'https'
    scrape_interval: 15s
    metrics_path: '/customer/v1/privileged/metrics'
    basic_auth:
      username: 'service_role'
      password_file: '/etc/prometheus/secrets/supabase_service_key'
    static_configs:
      - targets: ['mrwhtxbhrzyttlsyuofc.supabase.co']
        labels:
          environment: 'production'
          cluster: 'arch-supabase-pg17'
