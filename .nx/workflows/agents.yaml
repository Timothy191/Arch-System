# .nx/workflows/agents.yaml
agents:
  linux-medium-js:
    name: Linux Medium JS
    image: ubuntu22.04-node24.14-v1
    code:
      init:
        - uses: pnpm/action-setup@v4
          with:
            version: 9.15.9
        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: pnpm
        - run: pnpm install --frozen-lockfile
