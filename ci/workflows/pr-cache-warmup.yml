name: Predictive Cache Warmup

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Nx affected dry run
        run: pnpm nx run-many -t build --dry-run=json > nx-dry-run.json

      - name: Pre-fetch cache targets
        run: |
          echo "Nx remote cache warmup targets extracted from nx-dry-run.json"
          echo "Configure NXCACHE_S3_* secrets in repository settings for S3-backed cache"
