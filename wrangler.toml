# Cloudflare Workers configuration for Arch-System SCADA edge monitor
# Primary portal hosting remains on Vercel (https://arch-system.vercel.app);
# do not attach a wildcard /* route to this worker.

name = "arch-system-scada-monitor"
main = "workers/scada-monitor.js"
compatibility_date = "2025-11-01"
workers_dev = true

[observability]
enabled = true

[durable_objects]
bindings = [
  { name = "AGENT_COORDINATOR", class_name = "AgentCoordinator" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentCoordinator"]

[vars]
SCADA_STALE_THRESHOLD_MS = "60000"
REQUIRE_SCADA_AUTH = "true"

# Provision production ingest secret out-of-band before enabling ingest traffic:
#   wrangler secret put SCADA_INGEST_SECRET
# For local unauthenticated testing only, override with `--var REQUIRE_SCADA_AUTH:false`.
#
# Optional bindings (uncomment and supply real IDs before deploying):
# [[r2_buckets]]
# binding = "TELEMETRY_ARCHIVE_BUCKET"
# bucket_name = "arch-system-telemetry-archive"
#
# [[kv_namespaces]]
# binding = "SCADA_CONFIG_KV"
# id = "<kv-namespace-id>"
#
# [[queues.producers]]
# binding = "SCADA_TELEMETRY_QUEUE"
# queue = "arch-system-scada-events"
