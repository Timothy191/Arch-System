version: '3.8'

services:
  # ----------------------------------------
  # n8n - Workflow Automation Platform
  # ----------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: arch_system_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=${WEBHOOK_URL:-https://your-n8n-domain.com/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Africa/Johannesburg}
      # Database configuration (Postgres)
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_DATABASE=${DB_POSTGRESDB_DATABASE:-n8n}
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER:-postgres}
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-archsystem_secret}
      # Redis execution integration (allows n8n to scale workers if needed)
      - EXECUTIONS_MODE=regular
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ----------------------------------------
  # Redis - In-Memory Cache & Pub/Sub
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: arch_system_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-archsystem_redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-archsystem_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Postgres - Persistent State Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: arch_system_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_POSTGRESDB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD:-archsystem_secret}
      - POSTGRES_DB=${DB_POSTGRESDB_DATABASE:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_POSTGRESDB_USER:-postgres} -d ${DB_POSTGRESDB_DATABASE:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
  redis_data:
  postgres_data:
