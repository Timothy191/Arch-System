when:
  - event: [push, pull_request]
    branch: [main, 'feat/*', 'fix/*', 'chore/*']

steps:
  - name: quality-and-security-gates
    image: node:24-bookworm
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
      - pnpm type-check
      - pnpm lint
      - pnpm policy:check
      - pnpm audit:compliance
      - pnpm policy:security --ci
