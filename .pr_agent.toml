[config]
model = "anthropic/claude-3-7-sonnet"
fallback_models = ["openai/gpt-4o"]
publish_output_progress = true
ignore_pr_title = ["^chore\\(release\\):", "^chore\\(deps\\):"]

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
require_security_review = true
require_can_be_split_review = false
num_code_suggestions = 4
extra_instructions = """
Enforce Arch-System (Plantcor OS) P0-P3 production invariants:
1. Light Mode Only: NEVER permit dark: Tailwind utilities or raw hex/rgb/hsl colors; require semantic OKLCH tokens from @repo/theme.
2. Next.js 16 & React 19: NEVER query @repo/supabase/server or @repo/database inside 'use client' components; keep 'use client' at leaf components with serializable RSC props; prohibit forwardRef in new components and SWR imports.
3. Canonical 8-Step Server Action Sequence: Authenticate (getAuthenticatedEmployee) -> Authorize -> Validate (@repo/contract Zod) -> Rate-Limit (@repo/rate-limiter) -> Execute -> Audit Log (@repo/logger) -> Invalidate Tags (updateTagInAction BEFORE redirect()) -> Return Typed Result.
4. PostgreSQL 17 & RLS: Every new table must ENABLE ROW LEVEL SECURITY and use (SELECT auth.uid()) InitPlan subqueries.
5. Monorepo Boundaries: apps/* must not import packages/database directly; packages/ui must stay purely presentational; packages/theme must not import packages/ui.
6. Code Review Tips: Check readability/units, pure functions & immutability, explicit query .limit() and payload bounds, TOCTOU race safety, zero N+1/await waterfalls, and edge-case test assertions (401/403/400/429).
"""

[pr_description]
publish_labels = true
use_bullet_points = true
generate_ai_title = false

[pr_code_suggestions]
num_code_suggestions = 4
focus_only_on_problems = true
commitable_code_suggestions = true
extra_instructions = """
Prefer existing canonical SSoT helpers, hooks, and @repo/ui primitives over duplicating utilities.
Flag unbounded DB queries, missing Zod boundary parsing, uncleaned Realtime CDC subscriptions, and raw <img> tags.
"""
