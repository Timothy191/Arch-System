name: Keep-Warm & Synthetic Health Monitor

# Vercel Hobby limits vercel.json crons to once per day, so keep-warm pings
# for the portal and n8n run from GitHub Actions instead.
# Note: GitHub scheduled runs are best-effort and can start several minutes late.

on:
  schedule:
    # Runs every 5 minutes to maintain warmth and prevent scale-to-zero dormancy
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-portal:
    name: Warm portal serverless functions
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PORTAL_URL: ${{ vars.PRODUCTION_URL || 'https://arch-system-kappa.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Ping portal routes
        run: |
          # /api/health/warmup boots the Node runtime and touches Postgres + Redis.
          # /login warms the auth page render. Protected routes are skipped: without
          # a session cookie they only exercise the proxy redirect.
          for path in /api/health/warmup /login; do
            RESULT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 30 "${PORTAL_URL}${path}")
            echo "${path} -> HTTP ${RESULT%% *} in ${RESULT##* }s"
            CODE=${RESULT%% *}
            if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 400 ]; then
              # warmup returns 503 when a dependency is degraded; the function is still warm.
              echo "::warning ::${path} returned HTTP ${CODE}"
            fi
          done

      - name: Verify scheduled cron authentication (when CRON_SECRET is set)
        if: env.CRON_SECRET != ''
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${PORTAL_URL}/api/cron/preventative-maintenance")
          echo "/api/cron/preventative-maintenance -> HTTP ${STATUS}"
          if [ "$STATUS" -ne 200 ]; then
            echo "::warning ::Scheduled cron endpoint returned HTTP ${STATUS}"
          fi

  ping-n8n:
    name: Ping n8n Health Probe
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping n8n /healthz
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://n8n-vercel-alpha.vercel.app/healthz")
          echo "n8n /healthz responded with HTTP $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "::warning ::n8n health probe returned HTTP $STATUS"
            exit 1
          fi
