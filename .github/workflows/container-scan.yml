name: Container Scan & SBOM
on:
  workflow_run:
    workflows: ['Docker Build & Push']
    types: [completed]
permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy scan
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.29.0
        with:
          image-ref: ghcr.io/plantcor/arch-system-portal:${{ github.sha }}
          format: sarif
          output: trivy.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy.sarif
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/plantcor/arch-system-portal:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
