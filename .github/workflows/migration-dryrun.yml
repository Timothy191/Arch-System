name: Migration Dry-Run
on:
  pull_request:
    paths:
      - 'packages/database/migrations/**'
permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pnpm --filter @repo/database check-migrations
