name: Migration Dry-Run
on:
  pull_request:
    paths:
      - 'packages/database/migrations/**'
jobs:
  dryrun:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: pnpm --filter @repo/database check-migrations
