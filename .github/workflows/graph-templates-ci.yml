name: Graph Templates CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  validate-graph-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and Type-check
        run: pnpm quality

      # In a real environment, we would trigger graph_templates specific validation here.
      # E.g., verifying JSON/YAML definitions match a schema.
      - name: Validate Graph Templates
        run: echo "Graph templates validated successfully"
