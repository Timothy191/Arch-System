name: Theme CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/theme/**'
      - '.github/workflows/theme-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/theme/**'
      - '.github/workflows/theme-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme
        run: pnpm --filter @repo/theme build

      - name: Token drift check
        run: pnpm --filter @repo/theme lint:tokens

      # This step ensures the build output is deterministic and committed
      - name: Verify no uncommitted build artifacts
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Token build produced changes not committed. Please run 'pnpm build' and commit the output."
            git status
            exit 1
          fi

  visual-smoke:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm --filter portal build

      - name: Run visual smoke tests
        run: pnpm test:e2e:visual

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-screenshots
          path: e2e/visual/__snapshots__/
