name: Theme CI

on:
  push:
    branches: [main]
    paths:
      - "packages/theme/**"
      - ".github/workflows/theme-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/theme/**"
      - ".github/workflows/theme-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme
        run: pnpm --filter @repo/theme build

      - name: Token drift check
        run: pnpm --filter @repo/theme lint:tokens

      # This step ensures the build output is deterministic and committed
      - name: Verify no uncommitted build artifacts
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Token build produced changes not committed. Please run 'pnpm build' and commit the output."
            git status
            exit 1
          fi

  visual-smoke:
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build portal
        run: pnpm --filter portal build

      - name: Run visual smoke tests
        run: pnpm test:e2e:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: e2e/visual/__snapshots__/
