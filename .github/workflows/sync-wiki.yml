name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'tools/audits/audit-wiki.mjs'
      - '.github/workflows/sync-wiki.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'tools/audits/audit-wiki.mjs'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit Wiki Integrity (Frontmatter, Wikilinks & Index Coverage)
        run: node tools/audits/audit-wiki.mjs

      - name: Publish docs/wiki to GitHub Wiki
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/scripts/sync-github-wiki.mjs
