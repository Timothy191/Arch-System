name: Quality Intelligence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Quality verification mode"
        required: true
        default: "changed"
        type: choice
        options:
          - changed
          - full
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://mrwhtxbhrzyttlsyuofc.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci
  SUPABASE_URL: ${{ vars.SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://mrwhtxbhrzyttlsyuofc.supabase.co' }}
  SUPABASE_ANON_KEY: dummy-anon-key-for-ci
  SUPABASE_SERVICE_KEY: dummy-service-key-for-ci
  PORT: "3000"
  N8N_URL: http://localhost:5678
  FLOWISE_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres # secretlint-disable-line
  PAYLOAD_SECRET: dummy-payload-secret-for-ci

jobs:
  changed-quality-gate:
    name: Changed Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Changed-Scope Quality Orchestrator
        run: |
          BASE_REF="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          pnpm quality:changed -- --base "${BASE_REF}"

      - name: Run Policy, Contract Drift, Lint, Type-Check & Affected Tests
        run: |
          pnpm policy:check
          pnpm audit:drift
          pnpm turbo run //#lint:ci
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm turbo run type-check --filter=...[origin/main]
            pnpm turbo run test --filter=...[origin/main] -- --passWithNoTests
          else
            pnpm type-check
            pnpm test
          fi

      - name: Write Quality Report to Step Summary
        if: always()
        run: |
          if [ -f ".ci-local/quality-intelligence/latest.json" ]; then
            pnpm quality:report -- --format md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Changed Quality Evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-intelligence-changed-${{ github.run_id }}
          path: .ci-local/quality-intelligence/
          retention-days: 14
          if-no-files-found: ignore

  database-migration-gate:
    name: Database Migration & RLS Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Migration Drift & Rollback Safety
        run: pnpm --filter @repo/database check-migrations

      - name: Lint Migrations (Squawk + RLS)
        run: pnpm --filter @repo/database lint:migrations
        env:
          MIGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Run Database Security & RLS Tests
        run: pnpm --filter @repo/database test

      - name: Audit RLS Coverage Matrix
        run: pnpm audit:rls-matrix

  security-and-agent-governance:
    name: Security & Agent Governance Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Security Policy & Compliance Audits
        run: |
          pnpm policy:security -- --ci
          pnpm audit:compliance

      - name: Run SkillSpector Agent Security Scan
        run: bash tools/audits/skill-spector.sh

      - name: Verify Agent Completion Report (When Present)
        run: |
          if [ -f ".ci-local/quality-intelligence/agent-report.json" ]; then
            pnpm quality:agent -- --report .ci-local/quality-intelligence/agent-report.json --base "origin/${{ github.event.pull_request.base.ref || 'main' }}"
          else
            echo "No .ci-local/quality-intelligence/agent-report.json present; skipping agent verification."
          fi

      - name: Upload Agent Verification Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-intelligence-agent-verifications-${{ github.run_id }}
          path: .ci-local/quality-intelligence/agent-verifications/
          retention-days: 14
          if-no-files-found: ignore

  full-and-release-certification:
    name: Full Verification & Release Certification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs:
      [
        changed-quality-gate,
        database-migration-gate,
        security-and-agent-governance,
      ]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Full Quality Orchestrator
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "changed" ]; then
            pnpm quality:changed -- --base origin/main
          else
            pnpm quality:run -- --mode "$MODE" --base origin/main --update-baseline
          fi

      - name: Compare Against Verified Baseline
        run: pnpm quality:compare

      - name: Evaluate Release Certificate (Certification Only, Never Deploys)
        run: pnpm quality:release

      - name: Append Release Summary to Step Summary
        if: always()
        run: |
          if [ -f ".ci-local/quality-intelligence/latest.json" ]; then
            pnpm quality:report -- --format md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Quality Evidence & Release Certificate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-intelligence-release-${{ github.run_id }}
          path: |
            .ci-local/quality-intelligence/latest.json
            .ci-local/quality-intelligence/latest-report.md
            .ci-local/quality-intelligence/release-certificate.json
            .ci-local/quality-intelligence/release-certificate.md
            .ci-local/quality-intelligence/runs/
          retention-days: 30
          if-no-files-found: ignore
