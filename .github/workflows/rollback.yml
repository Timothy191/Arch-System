name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: production
permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/deploy.sh production --rollback
