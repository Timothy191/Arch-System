name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: production
permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/deploy.sh production --rollback
