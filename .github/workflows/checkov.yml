name: Checkov
on:
  push:
    paths: ['infra/**', 'terraform/**']
  pull_request:
    paths: ['infra/**', 'terraform/**']
permissions:
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bridgecrewio/checkov-action@3f0caf0c3aa9f56ade6b49f6e60b63aaeafb75a3 # v12
        with:
          directory: infra/
          framework: terraform,kubernetes,dockerfile
