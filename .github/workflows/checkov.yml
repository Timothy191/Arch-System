name: Checkov
on:
  push:
    paths: ['infra/**', 'terraform/**']
  pull_request:
    paths: ['infra/**', 'terraform/**']
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          framework: terraform,kubernetes,dockerfile
