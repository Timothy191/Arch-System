name: PR-Agent Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_url:
        description: 'Pull request URL to analyze'
        required: true
        type: string
      command:
        description: 'PR-Agent command (e.g. /describe, /improve, /ask, /generate_labels)'
        required: false
        default: '/describe'
        type: string

concurrency:
  group: pr-agent-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: PR-Agent Command Runner
    # Triggered on explicit slash commands (excluding /review, handled by kilo.yml) and manual dispatch
    if: |
      !endsWith(github.actor, '[bot]') && (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && (
          startsWith(github.event.comment.body, '/pr_agent') ||
          contains(github.event.comment.body, ' /pr_agent') ||
          startsWith(github.event.comment.body, '/describe') ||
          contains(github.event.comment.body, ' /describe') ||
          startsWith(github.event.comment.body, '/improve') ||
          contains(github.event.comment.body, ' /improve') ||
          startsWith(github.event.comment.body, '/ask') ||
          contains(github.event.comment.body, ' /ask') ||
          startsWith(github.event.comment.body, '/generate_labels') ||
          contains(github.event.comment.body, ' /generate_labels')
        )) ||
        (github.event_name == 'pull_request_review_comment' && (
          startsWith(github.event.comment.body, '/pr_agent') ||
          contains(github.event.comment.body, ' /pr_agent') ||
          startsWith(github.event.comment.body, '/describe') ||
          contains(github.event.comment.body, ' /describe') ||
          startsWith(github.event.comment.body, '/improve') ||
          contains(github.event.comment.body, ' /improve') ||
          startsWith(github.event.comment.body, '/ask') ||
          contains(github.event.comment.body, ' /ask') ||
          startsWith(github.event.comment.body, '/generate_labels') ||
          contains(github.event.comment.body, ' /generate_labels')
        )) ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check LLM API Key Availability
        id: llm_check
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${OPENAI_KEY:-}" ] || [ -n "${ANTHROPIC_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR-Agent skipped — configure OPENAI_KEY or ANTHROPIC_KEY secret to enable."
          fi

      - name: Run PR-Agent
        if: steps.llm_check.outputs.available == 'true'
        uses: The-PR-Agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b # v0.50.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          CONFIG__CLI_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          PR_URL: ${{ inputs.pr_url || '' }}
          PR_COMMAND: ${{ inputs.command || '' }}
