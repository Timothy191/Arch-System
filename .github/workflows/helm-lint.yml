name: Helm Lint
on:
  push:
    paths: ['infra/k8s/helm/**']
  pull_request:
    paths: ['infra/k8s/helm/**']
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - run: helm lint infra/k8s/helm
