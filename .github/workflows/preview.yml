name: Preview Environment
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  supabase-branch:
    name: Supabase Database Branching
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create or Update Supabase Branch
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Setting up Supabase branch for PR #${{ github.event.pull_request.number }}..."
          # Mocked for the demo: npx supabase branches create "pr-${{ github.event.pull_request.number }}"
          echo "Successfully created and linked branch pr-${{ github.event.pull_request.number }}"
