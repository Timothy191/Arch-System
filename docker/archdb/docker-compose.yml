services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archdb}
      POSTGRES_USER: ${POSTGRES_USER:-archdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - archdb_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archdb} -d ${POSTGRES_DB:-archdb}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../../services/archdb-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-archdb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-archdb}
      PORT: 8787
    ports:
      - "${ARCHDB_API_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  archdb_pgdata:
