[package]
name = "swarms-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.37", features = ["fs", "io-util", "macros", "net", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
